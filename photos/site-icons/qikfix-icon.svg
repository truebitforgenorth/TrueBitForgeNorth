<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="QikFix logo">
  <defs>
    <linearGradient id="badge" x1="34" y1="24" x2="222" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb36a"/>
      <stop offset="0.44" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#2fd6c4"/>
    </linearGradient>
    <linearGradient id="inner" x1="48" y1="32" x2="208" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1419"/>
      <stop offset="1" stop-color="#060408"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="18%" r="74%">
      <stop offset="0" stop-color="#ffb36a" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffb36a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="54" fill="#09070a"/>
  <g filter="url(#softShadow)">
    <rect x="20" y="20" width="216" height="216" rx="48" fill="url(#badge)"/>
    <rect x="31" y="31" width="194" height="194" rx="40" fill="url(#inner)"/>
    <rect x="31" y="31" width="194" height="194" rx="40" fill="url(#glow)"/>
    <path d="M48 191h160" stroke="#ffb36a" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M55 199h146" stroke="#2fd6c4" stroke-width="3" stroke-linecap="round" opacity="0.72"/>
  </g>

  <text x="128" y="132"
        fill="#fff2e6"
        font-family="Bebas Neue, Impact, Arial Black, sans-serif"
        font-size="92"
        font-weight="900"
        letter-spacing="3"
        text-anchor="middle">QF</text>
  <text x="128" y="177"
        fill="#ffb36a"
        font-family="Manrope, Arial, sans-serif"
        font-size="31"
        font-weight="900"
        letter-spacing="1.5"
        text-anchor="middle">QikFix</text>
  <path d="M69 66h118" stroke="#fff2e6" stroke-width="5" stroke-linecap="round" opacity="0.22"/>
