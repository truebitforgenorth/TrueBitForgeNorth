<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Taggen logo</title>
  <desc id="desc">A simple red and orange Taggen logo with black TNG initials.</desc>
  <defs>
    <linearGradient id="taggenGradient" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e64235"/>
      <stop offset="0.55" stop-color="#f59b31"/>
      <stop offset="1" stop-color="#7c1717"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#taggenGradient)"/>
  <text
    x="64"
    y="75"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="900"
    fill="#101114"
    letter-spacing="-1"
  >TNG</text>
</svg>
